<body>
  <div class="site-bg" aria-hidden="true"></div>
  <header class="header">

      <a class="brand" href="index.html"><span class="brand-mark">HG</span><span>Horizon Group</span></a>
      <nav class="nav">

        <a data-nav href="services.html">Services</a>

    <div id="admin-gate" class="panel" style="max-width:24rem;margin-top:1.5rem">

        <button type="button" class="btn btn-outline" id="clear-local">Vider</button>
